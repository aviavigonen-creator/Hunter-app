name: Update jobs
on:
  schedule:
    - cron: "17 2 * * *"   # every night, about 04:17-05:17 Israel time
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-jobs
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch_jobs.mjs
      - name: Publish if the list changed
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
